name: HEADS
description: "A Flutter project for real-time user location mapping."

publish_to: 'none' 

version: 1.0.4+6

environment:
  sdk: '^3.5.3'

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.3
  flutter_riverpod: ^2.0.0
  flutter_map: ^7.0.0  
  lottie: ^3.0.0      
  latlong2: ^0.9.1     # 座標データ用パッケージ
  mapbox_maps_flutter: 2.3.0
  qr_flutter: ^4.0.0
  flutter_svg: ^2.0.7
  url_launcher: ^6.2.4
  share_plus: ^7.2.1
  flutter_dotenv: ^5.1.0
  social_share: ^2.3.1
  geolocator: ^10.0.1
  flutter_advanced_segment: ^3.0.2
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.1
  firebase_core: ^3.8.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.5.1
  cloud_functions: ^5.2.0
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.2.0
  loading_animation_widget: ^1.3.0
  image: ^4.2.0
  image_cropper: ^8.0.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  intl: ^0.20.1
  freezed_annotation: ^2.4.4
  flutter_hooks: ^0.20.5
  flutter_local_notifications: ^18.0.1
  device_info_plus: ^11.2.1
  flutter_compass: ^0.8.1
  dotted_border: ^2.1.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_app_badger: ^1.5.0
  flutter_datetime_picker_plus: ^2.2.0
  shared_preferences: ^ 2.5.2
  change_app_package_name: ^1.4.0
  firebase_analytics: ^11.4.5
  appsflyer_sdk: ^6.16.2
  google_mobile_ads: ^5.3.1

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.5.7
  build_runner: ^2.4.0

flutter_icons:
  ios: true
  image_path: "assets/icon/icon_ios_heads.png"
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "assets/icon/background_icon.png"
  adaptive_icon_foreground: "assets/icon/foreground_icon.png"

# Splash画面設定
flutter_native_splash:
  image: assets/splash_heads.png
  color: '#000000'

flutter:
  uses-material-design: true
  assets:
    # .env はgitignore済みのため未コミット。ビルド時に .env.example を参考に別途配置すること
    - .env
    - assets/aaa.json
    - assets/cluster_source.json
    - assets/cluster_layer.json
    - assets/cluster_count_layer.json
    - assets/qr_background.jpg
    - assets/heads.svg
    - assets/instagram_logo.svg
    - assets/x_logo.svg
    - assets/clubIcon4.png
    - assets/clubIcon3.png
    - assets/angry.png
    - assets/love_smile.png
    - assets/normal_smile.png
    - assets/izakaya.jpg
    - assets/Animation - 1733401495297.json
    - assets/soundcloud.svg
    - assets/youtube.svg
    - assets/tiktok.svg
    - assets/clusterIcon.jpg
    - assets/dummyMapImg.jpg
    - assets/event_recruitment_banner.png
    - assets/small_cluster.jpg
    - assets/medium_cluster.jpg
    - assets/large_cluster.jpg
    - assets/shareBg/sharebg1.png
    - assets/shareBg/sharebg2.png
    - assets/shareBg/sharebg3.png
    - assets/shareBg/sharebg4.png
    - assets/shareBg/sharebg5.png
    - assets/red_marker.png
